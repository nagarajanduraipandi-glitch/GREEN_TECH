            <form method="post" action="{{ form_action }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{{ form.get('amount', '') }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        {% for c in categories %}
                        <option value="{{ c }}"{% if form.get('category') == c %} selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ form.get('date', '') }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Lunch with team"
                           maxlength="200"
                           value="{{ form.get('description', '') }}">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">{{ submit_label }}</button>
                    <a href="{{ url_for('profile') }}" class="btn-cancel">Cancel</a>
                </div>
            </form>
